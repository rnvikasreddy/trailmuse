# Render Blueprint: New > Blueprint in the Render dashboard, pick this repo.
# Render asks for MAPTILER_KEY on the first deploy. The onrender.com address is allowed
# automatically; your own domain goes in ALLOWED_HOSTS and CSRF_TRUSTED_ORIGINS below.
services:
  - type: web
    name: trailmuse
    runtime: docker
    plan: starter            # a persistent disk (for photos) needs a paid plan
    healthCheckPath: /
    disk:
      name: media
      mountPath: /app/media
      sizeGB: 5
    envVars:
      - key: DEBUG
        value: "0"
      - key: SERVE_MEDIA
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: trailmuse-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: stigrr.com,www.stigrr.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://stigrr.com,https://www.stigrr.com
      - key: MAPTILER_KEY
        sync: false
  # Loads real trails from OpenStreetMap and NASA elevation, then refreshes them every
  # Tuesday. "Trigger Run" in Render runs it on demand. Billed only for the minutes it runs.
  - type: cron
    name: trailmuse-refresh
    runtime: docker
    plan: starter
    schedule: "0 9 * * 2"
    dockerCommand: python manage.py refresh_trails
    envVars:
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: trailmuse-db
          property: connectionString
databases:
  - name: trailmuse-db
    databaseName: trailmuse
    plan: basic-1gb
    diskSizeGB: 15  # room for every US state's trails (about 4-6 GB)
